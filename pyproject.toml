[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfli-lib"
version = "0.1.19"
description = "Unified Fluorescence Lifetime Imaging (FLI) data processing platform using analytical and deep learning methods."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "CC BY-NC-ND 4.0"}
authors = [
    {name = "Vikas Pandey", email = "pyfli4lifetime@gmail.com"}
]
keywords = [
    "fluorescence", "lifetime", "FLIM", "FLI", "TCSPC", "phasor",
    "microscopy", "bioimaging", "ICCD", "SPAD", "laguerre", "deconvolution"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
# Core dependencies for the analytical methods
dependencies = [
    "h5py>=3.10.0",
    "sdtfile>=2025.0.0",
    "tifffile>=2025.0.0",
    "imagecodecs",
    "joblib>=1.3.0",
    "scikit-image>=0.22.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "scipy",
    "tqdm",
    "seaborn",
    "pillow",
    "tabulate>=0.10.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "PySide6>=6.4.0",
    "ipykernel>=6.0.0",
    "ipywidgets>=7.0.0",
]


[project.optional-dependencies]
gpu = [
    "nvidia-cuda-nvrtc",
    "nvidia-cuda-runtime",
]
tf = [
    "tensorflow>=2.15.0",
    "keras>=3.0.0",
]
dev = [
    "pytest",
    "black",
    "pre-commit",
]

docs = [
    "sphinx>=7.0",
    "pydata-sphinx-theme",
    "myst-nb",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-polyversion==1.1.0",
    "packaging",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pyfli*"]
exclude = ["notebooks*", "config*", "data*"]

[tool.setuptools.package-data]
pyfli = ["img/PyFLI_logo.png"]

[project.urls]
Homepage = "https://github.com/vkp217/pyfli-pkg"
Repository = "https://github.com/vkp217/pyfli-pkg.git"
Issues = "https://github.com/vkp217/pyfli-pkg/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::RuntimeWarning",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly so the enabled rules don't drift when the installed ruff
# version's *default* rule set changes between releases (only the version
# pinned in .pre-commit-config.yaml is authoritative for what actually gates
# commits/CI).
select = ["F", "E4", "E7", "E9", "W", "I", "UP", "PIE", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # ambiguous-unicode-character: false positives on
                                     # scientific notation (τ, α, ±, ×, — etc.) used
                                     # throughout this codebase's comments/docstrings
    "RUF059",  # unused-unpacked-variable: no auto-fix; excluded until a dedicated
               # cleanup pass reviews the existing hits
]
